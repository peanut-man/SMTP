services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: smtp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smtp_db
      POSTGRES_USER: smtp_user
      POSTGRES_PASSWORD: smtp_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smtp_user -d smtp_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Backend API ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smtp_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://smtp_user:smtp_pass@postgres:5432/smtp_db
      STORAGE_PATH: /app/storage/attachments
    volumes:
      - attachments_data:/app/storage/attachments
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: >
      sh -c "
        echo 'Running database migrations...' &&
        alembic upgrade head &&
        echo 'Starting API server...' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
      "

  # ── Email Worker ────────────────────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smtp_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://smtp_user:smtp_pass@postgres:5432/smtp_db
      STORAGE_PATH: /app/storage/attachments
    volumes:
      - attachments_data:/app/storage/attachments
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: ["python", "-m", "app.workers.email_worker"]

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    container_name: smtp_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
  attachments_data:
    driver: local
